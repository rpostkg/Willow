tweaks:
  - id: dark_theme
    name: Dark Theme
    category: Preferences
    description: Forcefully enables OS & app-wide dark mode.

  - id: quick_context_menu
    name: Quick Context Menu
    category: Preferences
    description: Restores the quick context menu

  - id: long_paths
    name: Enable Long File Paths
    category: Preferences
    description: Removes the character limit for file and folder paths.

  - id: show_file_extensions
    name: Show File Extensions
    category: Preferences
    description: Forcefully enables the display of file extensions in Windows Explorer.

  - id: show_hidden_files
    name: Show Hidden Files
    category: Preferences
    description: Forcefully enables the display of hidden files and folders in Windows Explorer.

  - id: game_mode
    name: Game Mode
    category: Preferences
    description: Enables Windows Game Mode to improve gaming performance.

  - id: disable_mouse_accel
    name: Disable Mouse Acceleration
    category: Preferences
    description: Makes the mouse movement linear.

  - id: disable_bing_search
    name: Disable web search
    category: Preferences
    description: Removes web search results from the Start menu and search bar.

  - id: verbose_bsod
    name: Verbose BSOD
    category: Preferences
    description: Shows technical information in the BSOD.

  - id: disable_sticky_keys
    name: Disable Sticky Keys
    category: Preferences
    description: Disables the prompt that appears when you hit Shift five times in rapid succession.

  - id: battery_percentage
    name: Battery Percentage in Tray
    category: Preferences
    description: Displays the battery charge percentage if the machine has a battery.

  - id: numlock_on_startup
    name: NumLock on Startup
    category: Preferences
    description: Num Lock starts enabled upon login.

  - id: logon_acrylic_blur
    name: Remove Logon Blur
    category: Preferences
    description: Removes the blur effect from the login screen.
