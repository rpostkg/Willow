tweaks:
  - id: disable_bg_apps
    name: Вимкнути фонові програми
    category: Просунуті твіки
    description: Запобігає роботі програм Microsoft Store у фоновому режимі.
    actions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications
        key: GlobalUserDisabled
        value: 1
        valueType: DWord
    revertActions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications
        key: GlobalUserDisabled
        value: 0
        valueType: DWord

  - id: disable_teredo
    name: Вимкнути тунелювання Teredo
    category: Просунуті твіки
    description: Вимикає тунелювання Teredo IPv6 для зменшення потенційної затримки мережі.
    actions:
      - type: Script
        script: netsh interface teredo set state disabled
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 1
        valueType: DWord
    revertActions:
      - type: Script
        script: netsh interface teredo set state default
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 0
        valueType: DWord

  - id: block_razer_autoinstall
    name: Блокувати Razer Synapse
    category: Просунуті твіки
    description: Запобігає автоматичному встановленню ПЗ Razer Synapse при підключенні пристроїв Razer.
    actions:
      - type: Registry
        hive: LocalMachine
        path: SOFTWARE\Microsoft\Windows\CurrentVersion\Device Installer
        key: DisableCoInstallers
        value: 1
        valueType: DWord
      - type: Script
        script: |
          $RazerSlop = "C:\Windows\Installer\Razer"
          if (!(Test-Path $RazerSlop)) { New-Item -Path $RazerSlop -ItemType Directory }
          icacls $RazerSlop /deny "Everyone:(W)"
    revertActions:
      - type: Script
        script: icacls "C:\Windows\Installer\Razer" /remove:d Everyone

  - id: performance_visual_effects
    name: Вимкнути візуальні ефекти
    category: Просунуті твіки
    description: Налаштовує візуальні ефекти Windows на «Найкращу швидкодію» (вимикає анімації, тіні тощо).
    actions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
        key: VisualFXSetting
        value: 3
        valueType: DWord
      - type: Script
        script: Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -Type Binary -Value ([byte[]](144,18,3,128,16,0,0,0))
    revertActions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
        key: VisualFXSetting
        value: 1
        valueType: DWord
      - type: Script
        script: Remove-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -ErrorAction SilentlyContinue

  - id: utc_time
    name: Годинник у форматі UTC
    category: Просунуті твіки
    description: Налаштовує системний годинник на UTC. Рекомендується якщо на машині встановлено більше однієї ОС.
    actions:
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Control\TimeZoneInformation
        key: RealTimeIsUniversal
        value: 1
        valueType: QWord

  - id: disable_ipv6
    name: Вимкнути IPv6
    category: Просунуті твіки
    description: Повністю вимикає протокол IPv6 на всіх мережевих адаптерах.
    actions:
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 255
        valueType: DWord
      - type: Script
        script: Disable-NetAdapterBinding -Name * -ComponentID ms_tcpip6 -ErrorAction SilentlyContinue
    revertActions:
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 0
        valueType: DWord
      - type: Script
        script: Enable-NetAdapterBinding -Name * -ComponentID ms_tcpip6 -ErrorAction SilentlyContinue
