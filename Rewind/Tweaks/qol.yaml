tweaks:
  - id: consumer_features
    name: Вимкнути споживчі функції
    category: QoL
    description: Windows не буде автоматично встановлювати ігри, сторонні програми або посилання на програми з MS Store.
    actions:
      - type: Registry
        hive: LocalMachine
        path: SOFTWARE\Policies\Microsoft\Windows\CloudContent
        key: DisableWindowsConsumerFeatures
        value: 1
        valueType: DWord
    revertActions:
      - type: Script
        script: Remove-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name "DisableWindowsConsumerFeatures" -Force

  - id: disable_widgets
    name: Вимкнути віджети
    category: QoL
    description: Повністю вимикає віджети Windows 11.
    minversion: 22000
    actions:
      - type: Script
        script: |
          Get-Process *Widget* | Stop-Process -ErrorAction SilentlyContinue
          Get-AppxPackage Microsoft.WidgetsPlatformRuntime -AllUsers | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          Get-AppxPackage MicrosoftWindows.Client.WebExperience -AllUsers | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
    revertActions:
      - type: Script
        script: |
          Add-AppxPackage -Register "C:\Program Files\WindowsApps\Microsoft.WidgetsPlatformRuntime*\AppxManifest.xml" -DisableDevelopmentMode -ErrorAction SilentlyContinue
          Add-AppxPackage -Register "C:\Program Files\WindowsApps\MicrosoftWindows.Client.WebExperience*\AppxManifest.xml" -DisableDevelopmentMode -ErrorAction SilentlyContinue

  - id: disable_hibernation
    name: Вимкнути гібернацію
    category: QoL
    description: Вимикає гібернацію. Економить місце на диску, не рекомендується вимикати на ноутбуках.
    actions:
      - type: Script
        script: powercfg.exe /hibernate off
      - type: Registry
        hive: LocalMachine
        path: System\CurrentControlSet\Control\Session Manager\Power
        key: HibernateEnabled
        value: 0
        valueType: DWord
    revertActions:
      - type: Script
        script: powercfg.exe /hibernate on
      - type: Registry
        hive: LocalMachine
        path: System\CurrentControlSet\Control\Session Manager\Power
        key: HibernateEnabled
        value: 1
        valueType: DWord
