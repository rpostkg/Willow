tweaks:
  - id: classic_context_menu
    name: Classic Context Menu
    category: Advanced
    description: Restores the quick right-click context menu in File Explorer.
    actions:
      - type: Script
        script: |
          New-Item -Path "HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32" -Force -Value ""
          Stop-Process -Name "explorer" -Force
    revertActions:
      - type: Script
        script: |
          Remove-Item -Path "HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}" -Recurse -Force
          Stop-Process -Name "explorer" -Force

  - id: disable_bg_apps
    name: Disable Background Apps
    category: Advanced
    description: Prevents Microsoft Store apps from running in the background.
    actions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications
        key: GlobalUserDisabled
        value: 1
        valueType: DWord
    revertActions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications
        key: GlobalUserDisabled
        value: 0
        valueType: DWord

  - id: disable_teredo
    name: Disable Teredo
    category: Advanced
    description: Disables Teredo IPv6 tunneling to reduce potential latency.
    actions:
      - type: Script
        script: netsh interface teredo set state disabled
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 1
        valueType: DWord
    revertActions:
      - type: Script
        script: netsh interface teredo set state default
      - type: Registry
        hive: LocalMachine
        path: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        key: DisabledComponents
        value: 0
        valueType: DWord

  - id: block_razer_autoinstall
    name: Block Razer Auto-Install
    category: Advanced
    description: Prevents Razer Synapse from auto-installing when plugging in Razer hardware.
    actions:
      - type: Registry
        hive: LocalMachine
        path: SOFTWARE\Microsoft\Windows\CurrentVersion\Device Installer
        key: DisableCoInstallers
        value: 1
        valueType: DWord
      - type: Script
        script: |
          $RazerPath = "C:\Windows\Installer\Razer"
          if (!(Test-Path $RazerPath)) { New-Item -Path $RazerPath -ItemType Directory }
          icacls $RazerPath /deny "Everyone:(W)"
    revertActions:
      - type: Script
        script: icacls "C:\Windows\Installer\Razer" /remove:d Everyone

  - id: performance_visual_effects
    name: Best Performance Visuals
    category: Advanced
    description: Sets Windows visual effects to 'Best Performance' (disables animations, shadows, etc).
    actions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
        key: VisualFXSetting
        value: 3
        valueType: DWord
      - type: Script
        script: Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -Type Binary -Value ([byte[]](144,18,3,128,16,0,0,0))
    revertActions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
        key: VisualFXSetting
        value: 1
        valueType: DWord
      - type: Script
        script: Remove-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask"
