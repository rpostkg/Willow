tweaks:
  - id: telemetry_master
    name: Disable System Telemetry
    category: Privacy
    description: Disables Microsoft Telemetry, Advertising ID, and Online Speech recognition.
    actions:
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo
        key: Enabled
        value: 0
        valueType: DWord
      - type: Registry
        hive: CurrentUser
        path: Software\Microsoft\Windows\CurrentVersion\Privacy
        key: TailoredExperiencesWithDiagnosticDataEnabled
        value: 0
        valueType: DWord
      - type: Registry
        hive: LocalMachine
        path: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection
        key: AllowTelemetry
        value: 0
        valueType: DWord
      - type: Service
        name: diagtrack
        targetState: Disabled
      - type: Service
        name: wermgr
        targetState: Disabled
      - type: Script
        script: Set-MpPreference -SubmitSamplesConsent 2
    revertActions:
      - type: Service
        name: diagtrack
        targetState: Automatic
      - type: Service
        name: wermgr
        targetState: Automatic
      - type: Script
        script: Set-MpPreference -SubmitSamplesConsent 1