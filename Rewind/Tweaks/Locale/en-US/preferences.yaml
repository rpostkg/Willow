tweaks:
  - id: dark_theme
    name: Dark Theme
    category: Preferences
    description: Enables the dark theme for Windows system UI and applications.

  - id: long_paths
    name: Enable Long File Paths
    category: Preferences
    description: Removes the 260-character limit for file and folder paths.

  - id: show_file_extensions
    name: Show File Extensions
    category: Preferences
    description: Displays file extensions in Windows Explorer.

  - id: show_hidden_files
    name: Show Hidden Files
    category: Preferences
    description: Displays hidden files and folders in Windows Explorer.

  - id: game_mode
    name: Game Mode
    category: Preferences
    description: Enables Windows Game Mode to improve performance while gaming.

  - id: disable_mouse_accel
    name: Disable Mouse Acceleration
    category: Preferences
    description: Disables pointer precision enhancement for consistent, linear mouse movement.

  - id: disable_bing_search
    name: Disable Bing Search
    category: Preferences
    description: Removes Bing web search results from the Start menu and search bar.

  - id: verbose_bsod
    name: Verbose Blue Screen
    category: Preferences
    description: Shows technical information instead of the smiley face on Blue Screen of Death.

  - id: disable_sticky_keys
    name: Disable Sticky Keys
    category: Preferences
    description: Disables the Sticky Keys prompt when Shift is pressed five times.

  - id: battery_percentage
    name: Battery Percentage in Tray
    category: Preferences
    description: Displays the battery charge percentage next to the power icon in the system tray.

  - id: numlock_on_startup
    name: NumLock on Startup
    category: Preferences
    description: Automatically enables the Num Lock key when Windows boots.

  - id: logon_acrylic_blur
    name: Remove Logon Blur
    category: Preferences
    description: Removes the acrylic blur effect from the Windows login screen background.
